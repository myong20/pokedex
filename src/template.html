<title>포켓몬 도감</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a red device-style header band over a dense grid of sprite cards; detail opens as a dialog. */
:root {
  --bg: #f3f1f0; --surface: #ffffff; --sunk: #ebe7e5; --fg: #221c1b; --muted: #776c69;
  --line: #e0d9d6; --red: #d6332a; --red-ink: #ffffff; --screen: #cfe6d4;
  --display: "Do Hyeon", "IBM Plex Sans KR", system-ui, sans-serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #171313; --surface: #221d1c; --sunk: #2c2524; --fg: #f1ebe9; --muted: #a99d9a;
  --line: #3a3130; --red: #b8281f; --red-ink: #ffffff; --screen: #24382b; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #171313; --surface: #221d1c; --sunk: #2c2524; --fg: #f1ebe9; --muted: #a99d9a;
  --line: #3a3130; --red: #b8281f; --red-ink: #ffffff; --screen: #24382b; color-scheme: dark }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--red); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1200px; margin: 0 auto; }
header { background: var(--red); color: var(--red-ink); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; box-shadow: 0 2px 0 rgba(0,0,0,.15); }
header .wrap { padding-block: 14px 12px; display: grid; gap: 10px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.count { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
h1 { white-space: nowrap; }
.lens { width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #bfe9ff, #2a8fd6 60%, #135a8c); border: 3px solid #fff; flex: none; }
.dots { display: flex; gap: 5px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; display: block; border: 1px solid rgba(0,0,0,.25); }
h1 { font-family: var(--display); font-weight: 400; font-size: 1.9rem; margin: 0; letter-spacing: .02em; }
.count { margin-left: auto; font-family: var(--mono); font-size: .85rem; opacity: .9; }
header .wrap > * { min-width: 0; }
.controls { display: grid; grid-template-columns: minmax(0, 2fr) repeat(3, minmax(0, 1fr)); gap: 8px; }
.forms-pick { position: relative; min-width: 0; }
.forms-pick summary { list-style: none; cursor: pointer; font: inherit; padding: 9px 26px 9px 12px; border-radius: 8px; border: 2px solid rgba(0,0,0,.15); background: var(--surface); color: var(--fg);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; position: relative; }
.forms-pick summary::-webkit-details-marker { display: none; }
.forms-pick summary::after { content: ""; position: absolute; right: 10px; top: 50%; width: 6px; height: 6px; border: solid currentColor; border-width: 0 2px 2px 0; transform: translateY(-70%) rotate(45deg); }
.forms-pick[open] summary::after { transform: translateY(-30%) rotate(-135deg); }
.forms-panel { position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(-50%); max-width: calc(100vw - 32px); z-index: 6; min-width: 210px; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.18); display: grid; }
.forms-panel label { display: flex; align-items: center; gap: 8px; padding: 9px 8px; border-radius: 6px; cursor: pointer; font-size: .9rem; }
.forms-panel label:hover { background: var(--sunk); }
.controls .forms-panel input { width: 18px; height: 18px; padding: 0; border: 0; flex: none; accent-color: var(--red); margin: 0; grid-column: auto; }
.forms-panel label { white-space: nowrap; }
.forms-panel small { color: var(--muted); }
.controls input, .controls select { font: inherit; padding: 9px 12px; border-radius: 8px; border: 2px solid rgba(0,0,0,.15); background: var(--surface); color: var(--fg); min-width: 0; width: 100%; }
@media (max-width: 760px) {
  .controls { grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr) minmax(0, 1fr); gap: 6px; }
  .controls input { grid-column: 1 / -1; }
  .forms-pick summary { font-size: .8rem; padding: 7px 20px 7px 8px; }
  .forms-pick summary::after { right: 8px; width: 5px; height: 5px; }
  .controls select { font-size: .8rem; padding: 7px 18px 7px 8px; appearance: none; -webkit-appearance: none; text-overflow: ellipsis;
    background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
    background-position: right 9px center, right 5px center; background-size: 4px 4px; background-repeat: no-repeat; }
}
.gens { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent); mask-image: linear-gradient(90deg, #000 85%, transparent); padding-right: 24px; }
.gens button { font: inherit; font-size: .85rem; border: 0; padding: 5px 11px; border-radius: 999px; background: rgba(0,0,0,.18); color: var(--red-ink); cursor: pointer; white-space: nowrap; }
.gens button[aria-pressed="true"] { background: #fff; color: #b8281f; font-weight: 700; }
main .wrap { padding-block: 18px 40px; }
#grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(136px, 1fr)); gap: 10px; }
@media (max-width: 480px) {
  #grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .card { padding: 8px; }
  .card.selected { padding: 7px; }
  header .wrap { padding-block: 10px 10px; gap: 8px; }
  h1 { font-size: 1.5rem; }
  .lens { width: 28px; height: 28px; }
  .facts span { font-size: .85rem; }
}
@media (max-width: 340px) { .dots { display: none; } }
.card { align-content: start; min-width: 0; grid-template-columns: minmax(0, 1fr); font: inherit; color: inherit; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; cursor: pointer; display: grid; gap: 4px; transition: transform .12s, border-color .12s; }
.card.selected { border: 2px solid var(--red); padding: 9px; box-shadow: 0 0 0 4px color-mix(in srgb, var(--red) 25%, transparent); }
.card:hover, .card:focus-visible { transform: translateY(-2px); border-color: var(--red); outline: none; }
.sprite { background: var(--screen); border-radius: 8px; aspect-ratio: 4 / 3; display: grid; place-items: center; max-width: 100%; }
.sprite { width: 100%; overflow: hidden; position: relative; }
.sprite img { position: absolute; inset: 0; image-rendering: pixelated; width: 100%; height: 100%; object-fit: contain; padding: 10%; box-sizing: border-box; display: block; }
.num { font-family: var(--mono); font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.name { font-weight: 700; font-size: 1rem; }
.types { display: flex; gap: 4px; flex-wrap: wrap; }
.type { font-size: .72rem; font-weight: 700; color: #fff; padding: 2px 8px; border-radius: 4px; letter-spacing: .02em; text-shadow: 0 1px 0 rgba(0,0,0,.25); }
.empty { text-align: center; color: var(--muted); padding: 48px 0; }
dialog { border: 0; padding: 0; border-radius: 16px; background: var(--surface); color: var(--fg); width: min(480px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); }
dialog::backdrop { background: rgba(20,10,10,.55); }
.d-top { padding: 18px 18px 14px; display: grid; grid-template-columns: 130px 1fr; gap: 16px; align-items: center; position: relative; }
.d-top .sprite { aspect-ratio: 1; }
.d-top h2 { font-family: var(--display); font-weight: 400; font-size: 2rem; margin: 2px 0; text-wrap: balance; }
.en { color: var(--muted); font-size: .85rem; }
.close { position: absolute; top: 8px; right: 10px; font-size: 1.5rem; line-height: 1; background: none; border: 0; color: var(--muted); cursor: pointer; padding: 6px; }
.d-body { padding: 0 18px 20px; display: grid; gap: 14px; }
.flavor { margin: 0; background: var(--sunk); border-radius: 10px; padding: 12px 14px; line-height: 1.6; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.facts div { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.facts b { display: block; font-size: .72rem; color: var(--muted); font-weight: 500; letter-spacing: .04em; }
.facts span { font-family: var(--mono); font-variant-numeric: tabular-nums; }
h3 { font-size: .78rem; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; font-weight: 500; }
.stat { display: grid; grid-template-columns: 64px 34px 1fr; gap: 8px; align-items: center; font-size: .88rem; padding: 2px 0; }
.stat b { font-family: var(--mono); font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: var(--sunk); border-radius: 4px; overflow: hidden; }
.bar span { display: block; height: 100%; border-radius: 4px; }
.forms { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 6px; }
.forms button { font: inherit; text-align: center; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 10px; padding: 6px; cursor: pointer; display: grid; gap: 3px; align-content: start; }
.forms button:hover, .forms button:focus-visible { border-color: var(--red); outline: none; }
.forms button[aria-pressed="true"] { border: 2px solid var(--fg); padding: 5px; }
.forms .sprite { aspect-ratio: 1; }
.forms .lv { font-size: .68rem; font-weight: 700; color: var(--red); letter-spacing: .03em; }
.forms .fn { font-size: .78rem; line-height: 1.3; word-break: keep-all; }
.bst { color: var(--fg); font-weight: 500; }
.tag { font-size: .7rem; font-weight: 700; color: var(--red); letter-spacing: .02em; }
 { display: flex; gap: 6px; flex-wrap: wrap; }
.more { font: inherit; font-size: .9rem; width: 100%; background: var(--sunk); color: var(--fg); border: 1px solid var(--line); padding: 12px; border-radius: 10px; cursor: pointer; }
.more:hover, .more:focus-visible { border-color: var(--red); outline: none; }
.abil { display: flex; gap: 6px; flex-wrap: wrap; }
.abil span { border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; font-size: .85rem; }
.abil .hidden { border-style: dashed; color: var(--muted); }
.nav { display: flex; justify-content: space-between; gap: 8px; }
.nav button { font: inherit; font-size: .85rem; background: var(--sunk); color: var(--fg); border: 0; padding: 7px 12px; border-radius: 8px; cursor: pointer; }
.nav button:disabled { opacity: .4; cursor: default; }
@media (max-width: 420px) { .d-top { grid-template-columns: 96px 1fr; } .d-top h2 { font-size: 1.6rem; } }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>

<header>
  <div class="wrap">
    <div class="brand">
      <div class="lens" aria-hidden="true"></div>
      <div class="dots" aria-hidden="true"><i style="background:#ff5b5b"></i><i style="background:#ffd23f"></i><i style="background:#5fd068"></i></div>
      <h1>포켓몬 도감</h1>
      <span class="count" id="count"></span>
    </div>
    <div class="controls">
      <input id="search" type="search" placeholder="이름·번호로 찾기 · Enter: 다음 (예: 피카츄)" autocomplete="off" aria-label="검색">
      <select id="typeFilter" aria-label="타입"><option value="">모든 타입</option></select>
      <details class="forms-pick" id="formPick">
        <summary id="formSummary">모든 모습</summary>
        <div class="forms-panel" id="formFilter">
          <label><input type="checkbox" value="st1" checked> 1단계</label>
          <label><input type="checkbox" value="st2" checked> 2단계</label>
          <label><input type="checkbox" value="st3" checked> 3단계</label>
          <label><input type="checkbox" value="mega" checked> 메가진화</label>
          <label><input type="checkbox" value="gmax" checked> 거다이맥스</label>
          <label><input type="checkbox" value="region" checked> 리전폼 <small>(알로라·가라르 등)</small></label>
          <label><input type="checkbox" value="other" checked> 그 밖의 모습</label>
        </div>
      </details>
      <select id="sortOrder" aria-label="정렬">
        <option value="evo">진화순</option><option value="dex">번호순</option><option value="bst">종족값순</option>
      </select>
    </div>
    <div class="gens" id="gens" role="group" aria-label="세대"></div>
  </div>
</header>
<main><div class="wrap"><div id="grid"></div></div></main>

<dialog id="detail" aria-labelledby="dName"><div id="dContent"></div></dialog>

<script>
const DEX = __DATA__;
const FORMS = __FORMS__;
DEX.forEach(p => { p.k = 'base'; p.sp = p.id; p.l = p.l || ''; });
FORMS.forEach(f => { const b = DEX[f.sp - 1]; f.e = b.e; f.g = b.g; f.f = b.f; });
const ALL = new Map([...DEX, ...FORMS].map(p => [p.id, p]));
const BY_SP = {};
[...DEX, ...FORMS].forEach(p => (BY_SP[p.sp] ||= []).push(p));
const TYPES = {
  normal:['노말','#9a9c8f'], fire:['불꽃','#e2552c'], water:['물','#3f84d8'], electric:['전기','#c99a06'],
  grass:['풀','#3c9a34'], ice:['얼음','#3bb5cf'], fighting:['격투','#c2541e'], poison:['독','#8d45b8'],
  ground:['땅','#a26a2c'], flying:['비행','#6c94d6'], psychic:['에스퍼','#e04877'], bug:['벌레','#86991c'],
  rock:['바위','#a39a6a'], ghost:['고스트','#6b4a8f'], dragon:['드래곤','#5463d6'], dark:['악','#5a4a48'],
  steel:['강철','#5d97ad'], fairy:['페어리','#d966c9'],
};
const KIND = { base: 0, mega: 1, gmax: 2, region: 3, other: 4 };
const total = p => p.s.reduce((a, b) => a + b, 0);
const STAT = ['HP','공격','방어','특수공격','특수방어','스피드'];
const GENS = [[1,1025,'전체'],[1,151],[152,251],[252,386],[387,493],[494,649],[650,721],[722,809],[810,905],[906,1025]];
const $ = id => document.getElementById(id);
const pad = n => 'No.' + String(n).padStart(4,'0');
// 그림이 없는 모습은 "그림 없음" 표시로 대신함
const NO_IMG = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"><circle cx="48" cy="38" r="20" fill="none" stroke="#8a807d" stroke-width="4" stroke-dasharray="6 5"/><text x="48" y="46" font-size="22" text-anchor="middle" fill="#8a807d" font-family="sans-serif" font-weight="700">?</text><text x="48" y="80" font-size="12" text-anchor="middle" fill="#8a807d" font-family="sans-serif">그림 없음</text></svg>');
const img = p => p.img ? 'data:image/webp;base64,' + p.img : NO_IMG;
const badge = t => `<span class="type" style="background:${TYPES[t][1]}">${TYPES[t][0]}</span>`;
let gen = 0, shown = [];

for (const [k,[ko]] of Object.entries(TYPES)) $('typeFilter').insertAdjacentHTML('beforeend', `<option value="${k}">${ko}</option>`);
GENS.forEach((g,i) => {
  const b = document.createElement('button');
  b.textContent = g[2] || `${i}세대`;
  b.onclick = () => { gen = i; render(); };
  $('gens').appendChild(b);
});
// 검색: 목록을 거르지 않고, 맞는 카드 위치로 이동해서 표시함 (Enter를 누르면 다음 카드로)
let found = [], foundAt = -1, findTimer;
$('search').oninput = () => { clearTimeout(findTimer); findTimer = setTimeout(() => find(false), 250); };
$('search').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); clearTimeout(findTimer); find(true); } };
function matches(p, q) {
  const num = /^\d+$/.test(q) ? +q : null;
  return num !== null ? p.sp === num : p.n.includes(q) || p.e.toLowerCase().includes(q) || p.l.includes(q);
}
function find(next) {
  const q = $('search').value.trim().toLowerCase().replace(/^no\.?\s*/, '').replace(/^#/, '');
  document.querySelectorAll('.card.selected').forEach(c => c.classList.remove('selected'));
  if (!q) { found = []; foundAt = -1; $('count').textContent = `${shown.length}마리`; return; }
  const list = shown.filter(p => matches(p, q));
  // 지금 고른 세대·타입·모습 안에 없으면 전체 목록으로 돌려서 다시 찾음
  if (!list.length && [...DEX, ...FORMS].some(p => matches(p, q)) && (gen || $('typeFilter').value || formBoxes().some(b => !b.checked))) {
    gen = 0; $('typeFilter').value = ''; formBoxes().forEach(b => b.checked = true); render(); return find(false);
  }
  const ids = list.map(p => p.id).join();
  if (ids !== found.map(p => p.id).join()) { found = list; foundAt = 0; }
  else if (next) foundAt = (foundAt + 1) % found.length;
  if (!found.length) { $('count').textContent = '없어요'; return; }
  const card = $('grid').querySelector(`[data-id="${found[foundAt].id}"]`);
  card.classList.add('selected');
  card.scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  $('count').textContent = found.length > 1 ? `${found.length}개 중 ${foundAt + 1}번째` : '찾았어요';
}
$('typeFilter').onchange = () => { render(); found = []; };
// 모습 고르기: 체크박스로 켜고 끄기
const formBoxes = () => [...$('formFilter').querySelectorAll('input')];
$('formFilter').onchange = render;
document.addEventListener('click', e => { if (!$('formPick').contains(e.target)) $('formPick').open = false; });
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('formPick').open = false; });
$('sortOrder').onchange = render;

function render() {
  const type = $('typeFilter').value;
  const [s,e] = GENS[gen];
  [...$('gens').children].forEach((b,i) => b.setAttribute('aria-pressed', i === gen));
  const on = new Set(formBoxes().filter(b => b.checked).map(b => b.value));
  // 평소 모습은 진화 단계(1·2·3단계)로 나눔. 같은 단계로 치는 모습(루가루암 한밤중의 모습 등)도 그 단계에 들어감
  const kindOf = p => p.k === 'base' || (p.st && p.k !== 'mega') ? 'st' + (p.st || DEX[p.sp - 1].st) : p.k;
  const pool = [...DEX, ...FORMS].filter(p => on.has(kindOf(p)));
  const boxes = formBoxes();
  $('formSummary').textContent = on.size === boxes.length ? '모든 모습' : on.size === 0 ? '모습 없음'
    : boxes.filter(b => b.checked).map(b => b.parentElement.firstChild.nextSibling.textContent.trim()).join('·');
  const key = $('sortOrder').value === 'evo' ? p => DEX[p.sp - 1].o : p => p.sp;
  shown = pool.filter(p => p.sp >= s && p.sp <= e && (!type || p.t.includes(type)));
  // 진화 순서: 지금 보이는 것 중 가장 앞 번호가 있는 진화 계열부터, 계열 안에서는 진화 단계 순서로
  const chainMin = {};
  shown.forEach(p => { const c = DEX[p.sp - 1].c; chainMin[c] = Math.min(chainMin[c] ?? Infinity, p.sp); });
  const evo = $('sortOrder').value === 'evo';
  // 종족값순: 종족값 합계가 높은 것부터
  const bst = $('sortOrder').value === 'bst';
  // 진화 단계 모습(같은 단계로 치는 모습 포함) → 메가 → 거다이맥스 → 리전폼 → 그 밖의 모습
  const grp = p => p.k === 'base' || p.st && p.k !== 'mega' ? 0 : KIND[p.k];
  const pos = p => p.k === 'base' ? 0 : p.before ? -1 : 1;
  const tie = (a,b) => pos(a) - pos(b) || (a.ord ?? a.id) - (b.ord ?? b.id);
  shown.sort((a,b) => evo
    ? chainMin[DEX[a.sp-1].c] - chainMin[DEX[b.sp-1].c] || grp(a) - grp(b) || key(a) - key(b) || tie(a,b)
    : bst ? total(b) - total(a) || a.sp - b.sp || grp(a) - grp(b) || tie(a,b)
    : key(a) - key(b) || grp(a) - grp(b) || tie(a,b));
  $('count').textContent = `${shown.length}마리`;
  $('grid').innerHTML = shown.length ? shown.map(p => `
    <button class="card" data-id="${p.id}">
      <div class="sprite"><img src="${img(p)}" alt="" loading="lazy"></div>
      <span class="num">${pad(p.sp)}${bst ? ` · <b class="bst">합계 ${total(p)}</b>` : ''}</span>
      <span class="name">${p.n}</span>${p.l ? `<span class="tag">${p.l}</span>` : ''}
      <span class="types">${p.t.map(badge).join('')}</span>
    </button>`).join('') : '<p class="empty">조건에 맞는 포켓몬이 없어요. 검색어나 타입을 바꿔 보세요.</p>';
}

$('grid').addEventListener('click', e => {
  const c = e.target.closest('.card');
  if (c) open(+c.dataset.id);
});
$('detail').addEventListener('click', e => { if (e.target === $('detail')) $('detail').close(); });

function open(id) {
  const p = ALL.get(id);
  // 진화 단계 → 메가 → 거다이맥스 → 리전폼 → 그 밖의 모습 (없는 건 빠짐)
  const chain = DEX.filter(x => x.c === DEX[p.sp - 1].c).sort((a,b) => a.o - b.o);
  const extra = k => chain.flatMap(x => BY_SP[x.id].filter(f => f.k === k && !(f.k !== 'base' && f.st)).sort((a, b) => (a.ord ?? a.id) - (b.ord ?? b.id)));
  const family = [
    // 같은 진화 단계로 치는 모습(예: 파밀리쥐 세 식구)은 진화 단계 줄에 함께 넣음
    ...chain.flatMap(x => {
      const same = BY_SP[x.id].filter(f => f.k !== 'base' && f.st);
      return [...same.filter(f => f.before), x, ...same.filter(f => !f.before)].map(o => [o, `${o.st}단계`]);
    }),
    ...extra('mega').map(f => [f, f.l]),
    ...extra('gmax').map(f => [f, '거다이맥스']),
    ...extra('region').map(f => [f, '리전폼']),
    ...extra('other').map(f => [f, '다른 모습']),
  ];
  const idx = shown.findIndex(x => x.id === id);
  const col = TYPES[p.t[0]][1];
  const total = p.s.reduce((a,b) => a + b, 0);
  $('dContent').innerHTML = `
    <div class="d-top" style="background:linear-gradient(${col}33, transparent)">
      <button class="close" aria-label="닫기" onclick="detail.close()">×</button>
      <div class="sprite"><img src="${img(p)}" alt="${p.n}"></div>
      <div>
        <span class="num">${pad(p.sp)}</span>
        <h2 id="dName">${p.n}</h2>${p.l ? `<div class="tag">${p.l}</div>` : ''}
        <div class="en">${p.e} · ${p.g}</div>
        <div class="types" style="margin-top:8px">${p.t.map(badge).join('')}</div>
      </div>
    </div>
    <div class="d-body">
      ${family.length > 1 ? `<div><h3>진화와 모습</h3><div class="forms">${family.map(([o, lv]) =>
        `<button data-form="${o.id}" aria-pressed="${o.id === p.id}">
          <div class="sprite"><img src="${img(o)}" alt=""></div>
          <span class="lv">${lv}</span>
          <span class="fn">${o.l && (o.k === 'base' || o.k === 'region' || o.k === 'other') ? `${o.n}<br><small>${o.l}</small>` : o.n}</span>
        </button>`).join('')}</div></div>` : ''}
      ${p.k === 'gmax' ? '<p class="flavor">거다이맥스는 다이맥스 중에 특정 포켓몬만 할 수 있는 특별한 모습이에요. 종족값은 기본 모습과 같고, 배틀에서는 다이맥스처럼 HP가 늘어나요.</p>' : p.f ? `<p class="flavor">${p.f}</p>` : ''}
      <div class="facts">
        <div><b>키</b><span>${p.k === 'gmax' ? '—' : (p.h/10).toFixed(1) + ' m'}</span></div>
        <div><b>몸무게</b><span>${p.k === 'gmax' ? '—' : (p.w/10).toFixed(1) + ' kg'}</span></div>
        <div><b>종족값 합계</b><span>${total}</span></div>
      </div>
      <div><h3>종족값</h3>${p.s.map((v,i) => `
        <div class="stat"><span>${STAT[i]}</span><b>${v}</b>
        <div class="bar"><span style="width:${Math.min(v/200*100,100)}%;background:${col}"></span></div></div>`).join('')}
      </div>
      <div><h3>특성</h3><div class="abil">${p.a.map(([n,h]) => `<span class="${h?'hidden':''}">${n}${h?' (숨겨진 특성)':''}</span>`).join('')}</div></div>
      <div class="nav">
        <button id="prev" ${idx <= 0 ? 'disabled' : ''}>← 이전</button>
        <button id="next" ${idx < 0 || idx >= shown.length - 1 ? 'disabled' : ''}>다음 →</button>
      </div>
    </div>`;
  $('dContent').querySelectorAll('[data-form]').forEach(b => b.onclick = () => open(+b.dataset.form));
  $('prev').onclick = () => open(shown[idx - 1].id);
  $('next').onclick = () => open(shown[idx + 1].id);
  if (!$('detail').open) $('detail').showModal();
}

render();
</script>
